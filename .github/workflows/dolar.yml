name: Enviar Cotação do Dólar

on:
  schedule:
    # O horário do GitHub Actions é em UTC. 
    # 15:00 UTC equivale a 12:00 (Meio-dia) no Horário de Brasília (UTC-3).
    - cron: '0 15 * * *'
  workflow_dispatch: # Permite rodar o script manualmente clicando num botão no GitHub

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script Python
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL:  ${{ secrets.TO_EMAIL }}
          FROM_NAME: "USD/BRL Bot"
          SUBJECT_PREFIX: "[Cotação]"
        run: python main.py
